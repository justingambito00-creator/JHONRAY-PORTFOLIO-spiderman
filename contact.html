<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Me</title>
    <!-- Comic-book heading font (needs internet; Comic Sans is the fallback). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
    <h1>Contact Me</h1>
    <p>Let's get connected!</p>
</header>

<nav class="menu" aria-label="Main menu">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html" class="active" aria-current="page">Contact</a>
</nav>

<main>
    <div class="comic">

        <section class="panel small p-b blue">
            <div class="panel-body">
                <h2 class="caption">Get in Touch</h2>
                <p>Email: jhonrayevangelista@email.com</p>
                <p>Facebook: Jhonray Evangelista</p>
                <p>Instagram: evangelista.jhonray</p>
            </div>
        </section>

        <section class="panel big p-a paper">
            <div class="panel-body">
                <span class="sfx sfx-4" aria-hidden="true">WHAM!</span>
                <h2 class="caption">Send a Message</h2>
                <form>
                    <label for="name">Your Name:</label>
                    <input id="name" type="text" placeholder="Enter your name">

                    <label for="email">Your Email:</label>
                    <input id="email" type="email" placeholder="Enter your email">

                    <label for="message">Your Message:</label>
                    <textarea id="message" placeholder="Write your message"></textarea>

                    <button type="button">Send Message</button>
                </form>
            </div>
        </section>
    </div>
</main>

<footer>
    <p>© 2026 My Personal Portfolio</p>
</footer>

</body>
</html>
